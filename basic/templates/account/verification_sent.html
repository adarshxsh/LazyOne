{% extends "base.html" %}

{% block title %}Verify your email{% endblock %}

{% block content %}
<div class="page-auth">
    <div class="mb-6 text-center">
        <h1 class="page-title">Check your inbox</h1>
        <p class="page-sub">We sent you a link to verify your email</p>
    </div>

    <div class="card p-6">
        <p class="text-ink-muted">Open the email and follow the link to finish signing up.</p>
        <p class="hint mt-3">Can't find it? Check your spam folder.</p>
        <a href="{% url 'home' %}" class="btn btn-secondary btn-lg mt-5 w-full">Back to home</a>
    </div>
</div>
{% endblock %}
